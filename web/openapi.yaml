openapi: 3.0.1
info:
  title: KRT-run API
  description: API for the monthly running-proof data (company F)
  version: 1.0.0
servers:
  - url: https://REPLACE-ME.azurewebsites.net
paths:
  /api/health:
    get:
      operationId: health
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  env: { type: string, example: dev }
                  time: { type: string, format: date-time }
  /api/runs:
    get:
      operationId: listRuns
      summary: List the submissions of a month
      description: Send the x-api-key header (added by APIM) to see everything; otherwise a login session is required.
      parameters:
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: yyyy-MM }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
        '401': { description: Unauthorized }
  /api/leaderboard:
    get:
      operationId: leaderboard
      summary: Leaderboard of approved km per month
      parameters:
        - { name: month, in: query, required: false, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: yyyy-MM }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        employeeCode: { type: string }
                        km: { type: number }
                        runs: { type: integer }
        '401': { description: Unauthorized }
components:
  schemas:
    Run:
      type: object
      properties:
        runId: { type: string }
        month: { type: string }
        employeeCode: { type: string }
        km: { type: number }
        runDate: { type: string, format: date }
        status:
          type: string
          enum: [PENDING_PROCESSING, PENDING_REVIEW, REJECTED_INVALID, APPROVED, REJECTED]
        createdUtc: { type: string, format: date-time }
