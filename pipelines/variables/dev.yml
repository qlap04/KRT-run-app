# Environment: dev  (only active environment)
# Resource names must match the Bicep in the infra repo: <prefix>-<resourceEnv>-web / -func / -apim.
variables:
  environment: dev
  resourceGroup: rg-krtrun-dev
  apimResourceGroup: rg-krtrun-dev-apim   # APIM has its own RG (infra main.bicep)
  webAppName: krtrun-dev-web
  functionAppName: krtrun-dev-func
  apimName: krtrun-dev-apim
  deployApim: 'true'
