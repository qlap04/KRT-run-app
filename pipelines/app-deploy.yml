# KRT-run app deploy (repo: app)
# develop -> Build (one job: unit + integration tests on the same build, package) -> DeployDev (approval on Environment krtrun-dev)
# Optional: tick deployInfra to run the infra provision (main.bicep, no APIM) before the app deploy.
name: krtrun-app-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - web/**
    - function/**
    - pipelines/**
pr: none

parameters:
- name: deployInfra
  displayName: Provision infra first (main.bicep, no APIM)
  type: boolean
  default: false

# The infra repo owns the Bicep 
resources:
  repositories:
  - repository: infra
    type: github
    name: qlap04/KRT-run-infra
    ref: refs/heads/develop
    endpoint: github.com_qlap04   # GitHub service connection (Azure Pipelines app)

pool:
  vmImage: ubuntu-latest

# Service connection: per environment, set in variables/<env>.yml and read with
variables:
- template: variables/common.yml
- template: variables/dev.yml

stages:
- stage: Build
  displayName: Build
  jobs:
  # One job: build once, unit + integration test that build, then publish it.
  - job: Build
    displayName: Build, test and package
    steps:
    - template: templates/steps/node-build.yml
      parameters:
        nodeVersion: $(nodeVersion)
        artifactName: $(artifactName)

# Separate stage from DeployDev because:
# - it is inserted only when deployInfra is ticked (compile-time ${{ if }});
# - dependsOn: [] runs it in parallel with Build, while DeployDev waits for the artifact;
# - infra variables (from the infra repo) stay out of the app's variable scope;
# - a Bicep failure is isolated and can be rerun without redeploying the app.
- ${{ if eq(parameters.deployInfra, true) }}:
  - stage: ProvisionInfra
    displayName: Provision infra DEV
    dependsOn: []
    variables:
    # Infra variables (location, ...) come from the infra repo, so they are not duplicated here.
    - template: pipelines/variables/common.yml@infra
    - template: pipelines/variables/dev.yml@infra
    - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env group: subscriptionId
    - name: parametersFile
      value: bicep/env/dev.bicepparam
    jobs:
    - deployment: Provision
      displayName: Lint, what-if and deploy
      environment: ${{ variables.projectName }}-${{ variables.environment }}
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: infra
            - template: pipelines/templates/steps/bicep-deployment.yml@infra
              parameters:
                deploymentName: $(projectName)-$(environment)-$(Build.BuildId)
                serviceConnection: ${{ variables.serviceConnection }}
                subscriptionId: $(subscriptionId)
                location: $(location)
                parametersFile: $(parametersFile)

- stage: DeployDev
  displayName: Deploy DEV
  # Runs after infra when deployInfra is ticked, so the app settings are written last.
  dependsOn:
  - Build
  - ${{ if eq(parameters.deployInfra, true) }}:
    - ProvisionInfra
  variables:
  # Secrets SESSION_SECRET, ADMIN_CODE, API_KEY (business config owned by the app)
  - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env group
  jobs:
  - deployment: Deploy
    displayName: Deploy app
    environment: ${{ variables.projectName }}-${{ variables.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/steps/app-deploy.yml
            parameters:
              serviceConnection: ${{ variables.serviceConnection }}
              artifactName: $(artifactName)
              resourceGroup: $(resourceGroup)
              webAppName: $(webAppName)
              functionAppName: $(functionAppName)
              appSettings: $(appSettings)
          # Publish to APIM only after the app is deployed and healthy.
          - template: templates/steps/apim-publish.yml
            parameters:
              serviceConnection: ${{ variables.serviceConnection }}
              artifactName: $(artifactName)
              apimResourceGroup: $(apimResourceGroup)
              apimName: $(apimName)
              apiPath: $(projectName)        # APIM path = project name
              webAppName: $(webAppName)
