# KRT-run app deploy (repo: app)
# develop -> Build (unit + integration tests, package) -> DeployDev (approval on Environment krtrun-dev)
name: krtrun-app-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - web/**
    - function/**
    - pipelines/**
pr: none

pool:
  vmImage: ubuntu-latest

# Service connection: per environment, set in variables/<env>.yml and read with
variables:
- template: variables/common.yml
- template: variables/dev.yml

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: Build
    displayName: Unit test and package
    steps:
    - checkout: self
    - template: templates/steps/node-build.yml
      parameters:
        nodeVersion: $(nodeVersion)
        artifactName: $(artifactName)

  # Parallel with Build; a failure stops the deploy.
  - job: IntegrationTest
    displayName: Integration test
    steps:
    - checkout: self
    - template: templates/steps/node-integration-test.yml
      parameters:
        nodeVersion: $(nodeVersion)

- stage: DeployDev
  displayName: Deploy DEV
  dependsOn: Build
  variables:
  # Secrets SESSION_SECRET, ADMIN_CODE, API_KEY (business config owned by the app)
  - group: ${{ variables.projectName }}-${{ variables.environment }}   # per-env group
  jobs:
  - deployment: Deploy
    displayName: Deploy app
    environment: ${{ variables.projectName }}-${{ variables.environment }}
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/steps/app-deploy.yml
            parameters:
              serviceConnection: ${{ variables.serviceConnection }}
              artifactName: $(artifactName)
              resourceGroup: $(resourceGroup)
              apimResourceGroup: $(apimResourceGroup)
              webAppName: $(webAppName)
              functionAppName: $(functionAppName)
              apimName: $(apimName)
              apiPath: $(apiPath)
