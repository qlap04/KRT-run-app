# KRT-run app deploy (repo: app)
#
# develop → Build → DEV
# Approval: Azure DevOps Environment krtrun-dev.
name: krtrun-app-deploy-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
    - develop
  paths:
    include:
    - web/**
    - function/**
    - pipelines/**
pr: none

stages:
- stage: Build
  displayName: Build
  variables:
  - template: variables/common.yml
  jobs:
  - template: templates/build-node.yml

- template: templates/deploy-app.yml
  parameters:
    stageName: DeployDev
    environment: dev
    dependsOn: [Build]
    condition: succeeded()
