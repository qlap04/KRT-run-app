# Steps: integration tests (web) against Azurite (storage emulator).
# Azurite via docker run (needs --skipApiVersionCheck; service containers cannot override CMD).
# Included by node-build.yml after the web npm ci, so it tests the same install.
steps:
- script: |
    docker run -d --name storage-emulator -p 10000-10002:10000-10002 \
      mcr.microsoft.com/azure-storage/azurite \
      azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    for port in 10000 10001 10002; do
      timeout 30 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 1; done" \
        || { echo "Emulator port $port is not ready"; docker logs storage-emulator; exit 1; }
    done
  displayName: Start Azurite

# Config via env only. 
- script: npm run test:integration:ci
  workingDirectory: web
  displayName: Integration test (web)
  env:
    STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
    INTEGRATION_REQUIRED: 'true'

- script: docker rm -f storage-emulator
  displayName: Stop Azurite
  condition: always()
