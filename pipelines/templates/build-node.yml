# Build: unit tests + package zips (parallel: integration tests).
jobs:
- job: Build
  displayName: Unit test & package
  pool: { vmImage: $(vmImage) }
  steps:
  - checkout: self

  - task: UseNode@1
    displayName: Use Node $(nodeVersion)
    inputs:
      version: $(nodeVersion)

  # --- Unit tests
  - task: Npm@1
    displayName: npm ci (web)
    inputs:
      command: ci
      workingDir: web

  - task: Npm@1
    displayName: Unit test (web)
    inputs:
      command: custom
      workingDir: web
      customCommand: run test:unit:ci

  - task: Npm@1
    displayName: npm ci (function)
    inputs:
      command: ci
      workingDir: function

  - task: Npm@1
    displayName: Unit test (function)
    inputs:
      command: custom
      workingDir: function
      customCommand: run test:unit:ci

  - task: PublishTestResults@2
    displayName: Publish unit results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(System.DefaultWorkingDirectory)/**/test-results/unit.xml
      testRunTitle: Unit tests

  # --- Package web (no node_modules; App Service builds via SCM_DO_BUILD_DURING_DEPLOYMENT)
  - task: CopyFiles@2
    displayName: Stage web
    inputs:
      SourceFolder: web
      Contents: |
        **
        !node_modules/**
        !tests/**
        !test-results/**
        !.env*
      TargetFolder: $(Build.BinariesDirectory)/web

  - task: ArchiveFiles@2
    displayName: Zip web
    inputs:
      rootFolderOrFile: $(Build.BinariesDirectory)/web
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/web.zip

  # --- Package function (production node_modules only)
  - task: DeleteFiles@1
    displayName: Clear function node_modules
    inputs:
      SourceFolder: function
      Contents: node_modules
      RemoveSourceFolder: false

  - task: Npm@1
    displayName: npm ci --omit=dev (function)
    inputs:
      command: custom
      workingDir: function
      customCommand: ci --omit=dev

  - task: CopyFiles@2
    displayName: Stage function
    inputs:
      SourceFolder: function
      Contents: |
        **
        !tests/**
        !test-results/**
        !local.settings*.json
        !.env*
      TargetFolder: $(Build.BinariesDirectory)/function

  - task: ArchiveFiles@2
    displayName: Zip function
    inputs:
      rootFolderOrFile: $(Build.BinariesDirectory)/function
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(Build.ArtifactStagingDirectory)/function.zip

  # --- Publish
  - task: CopyFiles@2
    displayName: Stage openapi.yaml
    inputs:
      SourceFolder: web
      Contents: openapi.yaml
      TargetFolder: $(Build.ArtifactStagingDirectory)

  - task: PublishPipelineArtifact@1
    displayName: Publish artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifact: $(artifactName)

# Parallel with Build; fails the Build stage (and all deploys) on failure.
# Azurite via docker run (needs --skipApiVersionCheck; service containers cannot override CMD).
- job: IntegrationTest
  displayName: Integration test
  pool: { vmImage: $(vmImage) }
  steps:
  - checkout: self

  - task: UseNode@1
    displayName: Use Node $(nodeVersion)
    inputs:
      version: $(nodeVersion)

  - script: |
      docker run -d --name storage-emulator -p 10000-10002:10000-10002 \
        mcr.microsoft.com/azure-storage/azurite \
        azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
      for port in 10000 10001 10002; do
        for i in $(seq 1 30); do
          (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null && break
          sleep 1
        done
        (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null || { echo "Emulator port $port is not ready"; docker logs storage-emulator; exit 1; }
      done
      echo "Emulator ready"
    displayName: Start Azurite

  - task: Npm@1
    displayName: npm ci (web)
    inputs:
      command: ci
      workingDir: web

  - task: Npm@1
    displayName: Integration test (web)
    inputs:
      command: custom
      workingDir: web
      customCommand: run test:integration:ci
    # All test configuration is passed through env only (nothing is hard-coded in the tests).
    # UseDevelopmentStorage=true is the public Azurite shortcut, not a secret.
    # The tests create their own random-named containers/queue/tables and delete them afterwards.
    env:
      STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      INTEGRATION_REQUIRED: 'true'   # fail instead of silently skipping if the emulator config is missing

  - task: PublishTestResults@2
    displayName: Publish integration results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(System.DefaultWorkingDirectory)/web/test-results/integration.xml
      testRunTitle: Integration tests

  - script: docker rm -f storage-emulator
    displayName: Stop Azurite
    condition: always()
